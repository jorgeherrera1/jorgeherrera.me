<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="128" height="128" shape-rendering="crispEdges">
  <!-- Pixel-art ? block: palette mirrors the mario-bros-lava scale in global.css -->
  <rect width="16" height="16" fill="#000000"/>
  <rect x="1" y="1" width="14" height="14" fill="#EA4F2A"/>
  <!-- top/left highlight, bottom/right shade -->
  <rect x="1" y="1" width="14" height="1" fill="#F9C0A8"/>
  <rect x="1" y="1" width="1" height="14" fill="#F9C0A8"/>
  <rect x="1" y="14" width="14" height="1" fill="#7C240E"/>
  <rect x="14" y="1" width="1" height="14" fill="#7C240E"/>
  <!-- corner rivets -->
  <rect x="2" y="2" width="1" height="1" fill="#FFFFFF"/>
  <rect x="13" y="2" width="1" height="1" fill="#FFFFFF"/>
  <rect x="2" y="13" width="1" height="1" fill="#FFFFFF"/>
  <rect x="13" y="13" width="1" height="1" fill="#FFFFFF"/>
  <!-- ? glyph drop shadow -->
  <rect x="7" y="4" width="4" height="1" fill="#7C240E"/>
  <rect x="6" y="5" width="1" height="2" fill="#7C240E"/>
  <rect x="11" y="5" width="1" height="2" fill="#7C240E"/>
  <rect x="10" y="7" width="1" height="1" fill="#7C240E"/>
  <rect x="9" y="8" width="1" height="2" fill="#7C240E"/>
  <rect x="9" y="11" width="1" height="1" fill="#7C240E"/>
  <!-- ? glyph -->
  <rect x="6" y="3" width="4" height="1" fill="#FFFFFF"/>
  <rect x="5" y="4" width="1" height="2" fill="#FFFFFF"/>
  <rect x="10" y="4" width="1" height="2" fill="#FFFFFF"/>
  <rect x="9" y="6" width="1" height="1" fill="#FFFFFF"/>
  <rect x="8" y="7" width="1" height="2" fill="#FFFFFF"/>
  <rect x="8" y="10" width="1" height="1" fill="#FFFFFF"/>
</svg>
